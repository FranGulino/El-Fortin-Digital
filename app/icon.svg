<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Fondo redondeado con la estética oscura premium de la app -->
  <rect width="32" height="32" rx="8" fill="#111412" />
  
  <!-- Borde decorativo verde vibrante -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="#2d6a4f" stroke-width="1.5" />
  
  <!-- Escudo Tricolor en el centro -->
  <g transform="translate(8, 7)">
    <clipPath id="shield-clip">
      <path d="M0,0 L16,0 L16,11 C16,15 8,18 8,18 C8,18 0,15 0,11 Z" />
    </clipPath>
    
    <!-- Contenedor recortado con la forma del escudo -->
    <g clip-path="url(#shield-clip)">
      <!-- Fondo blanco (Franja central blanca) -->
      <rect width="16" height="18" fill="#ffffff" />
      
      <!-- Franja izquierda: Verde de Villa Mitre -->
      <rect x="0" y="0" width="5.33" height="18" fill="#2d6a4f" />
      
      <!-- Franja derecha: Negro del tricolor -->
      <rect x="10.67" y="0" width="5.33" height="18" fill="#000000" />
    </g>
    
    <!-- Contorno fino del escudo para que se vea súper nítido -->
    <path d="M0,0 L16,0 L16,11 C16,15 8,18 8,18 C8,18 0,15 0,11 Z" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8" />
  </g>
</svg>
